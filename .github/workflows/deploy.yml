# Deploys the Worker. Manual on purpose: this repo is one person's instance,
# and pushing to main should not silently replace what is live.
#
# Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   an API token with Workers Scripts:Edit + R2:Edit
#   CLOUDFLARE_ACCOUNT_ID  the account the dropbin bucket lives in
#
# ACCESS_PASSWORD is NOT set here. It is a Worker secret, set once with
# `npx wrangler secret put ACCESS_PASSWORD`, and it survives a deploy.
name: Deploy Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Read through env, never interpolated into the script itself.
      - name: Credentials present
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets first"
            exit 1
          fi

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The password is the one thing a deploy can quietly leave wrong.
      - name: Remind about the password
        run: |
          echo "Deployed. If this instance is new, confirm the password is not still 'changeme':"
          echo "  curl -o /dev/null -w '%{http_code}\n' -H 'X-Pass: YOUR_PASSWORD' https://HOST/?info=1"
