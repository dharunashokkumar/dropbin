# Releases the `db` client to npm as `dropbin`, from cli/.
#
# Tag the commit `v1.2.3` (matching cli/package.json) and publish a GitHub
# release, or run this by hand. Needs one repository secret: NPM_TOKEN, an
# automation token for the npm account that owns `dropbin`.
name: Publish db to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and check without publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write        # npm provenance

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Same checks CI runs, so a release cannot ship a file that does not parse.
      - name: The package parses and stays dependency-free
        run: |
          for f in cli/src/*.js cli/bin/*.js; do node --check "$f"; done
          node -e '
            const p = require("./cli/package.json");
            if (Object.keys(p.dependencies || {}).length) { console.error("::error::cli/ must stay zero-dependency"); process.exit(1); }
          '
          node cli/bin/db.js --help > /dev/null

      # A tag that disagrees with package.json publishes the wrong version.
      - name: Tag matches cli/package.json
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./cli/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match cli/package.json ($pkg)"
            exit 1
          fi
          echo "publishing $pkg"

      - name: What would ship
        working-directory: cli
        run: npm pack --dry-run

      - name: Publish
        if: github.event_name == 'release' || inputs.dry_run == false
        working-directory: cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
