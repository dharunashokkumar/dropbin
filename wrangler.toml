name = "dropbin"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

# The access password lives in a secret, never here:
#   npx wrangler secret put ACCESS_PASSWORD
# It is deliberately absent from [vars]: Wrangler refuses a secret whose name a
# plain var already holds ("Binding name 'ACCESS_PASSWORD' already in use"), so
# listing it here would lock the password into the file. With no secret set the
# Worker falls back to "changeme" in code, which is what `wrangler dev` uses.
[vars]
# What the storage meter counts down from. R2's free tier is 10 GB.
QUOTA_GB = "10"
# Ceiling for zipping an old multi-file pin on the way out. It is a CPU budget,
# not a storage one: hashing costs ~1.4 ms per MB and a free-plan Worker gets
# 10 ms per request. Nothing written by this version needs it.
ZIP_LIMIT_MB = "5"
# The longest a `db open` / `db qr` share link may be signed for. Those links
# carry a signature instead of the password, so the browser they land in is
# never asked for one; db itself asks for a week.
SHARE_HOURS = "720"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "dropbin"

# Serve the CLI helpers as strings baked into the Worker.
[[rules]]
type = "Text"
globs = ["**/*.sh", "**/*.ps1"]
fallthrough = false

[observability]
enabled = true

# Wrangler creates the DNS record for this itself; the zone has to already be
# on the same Cloudflare account. Change the pattern to deploy your own.
[[routes]]
pattern = "files.dharun.dev"
custom_domain = true
